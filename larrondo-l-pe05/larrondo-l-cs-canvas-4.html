<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            font-family: sans-serif;
        }
	
        button{
            font-size:1.2em;
        }       
	
        section{
            margin:.5em 0 .5em 0;
        }
    </style>
</head>
<body>
    <section>
        <button id="btnPlay">Play</button>
        <button id="btnPause">Pause</button>
    </section>
    <section>
        <span>
            <input type="checkbox" id="cbRectangles" checked>
            <label for="cbRectangles">Rectangles</label>
        </span>
    </section>
    <section>
        <p>Click on the screen to "spraypaint" rectangles (you probably want the screensaver to be paused)</p>
    </section>

    <canvas id="canvas" width="800" height="600" style="border:1px solid #000000;"></canvas>
    
    <script>
    // Starter helper functions
    function getRandomColor(){
        function getByte(){
            return 55 + Math.round(Math.random() * 200);
        }
        return `rgba(${getByte()}, ${getByte()}, ${getByte()}, 0.8)`;
    }

    function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function canvasClicked(e){
        let rect = e.target.getBoundingClientRect();
        let mouseX = e.clientX - rect.x;
        let mouseY = e.clientY - rect.y;
        console.log(mouseX,mouseY);

        // Drawing the rectangles
        for(let i = 0; i < 10; i++){
            drawRectangle(
                ctx,
                mouseX + getRandomInt(-50, 50),
                mouseY + getRandomInt(-50, 50),
                getRandomInt(20, 100),
                getRandomInt(20, 100),
                getRandomColor(),
                getRandomInt(1, 5),
                getRandomColor()
            );
        }
    }

    // Main code
    // Vars
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    let paused = false;
    let createRectangles = true;

    // Added functions
    function setupUI(){
        document.querySelector('#btnPlay').addEventListener('click', () => paused = false);
        document.querySelector('#btnPause').addEventListener('click', () => paused = true);
        canvas.addEventListener('click', canvasClicked);
        document.querySelector('#cbRectangles').addEventListener('change', (e) => {
            createRectangles = e.target.checked;
        });
    }

    function drawRandomRect() {
        const x = getRandomInt(0, canvas.width);
        const y = getRandomInt(0, canvas.height);
        const width = getRandomInt(20, 200);
        const height = getRandomInt(20, 200);

         drawRectangle(
                ctx,
                x,
                y,
                width,
                height,
                getRandomColor(),
                getRandomInt(1, 10),
                getRandomColor()
            );
    }

    function update() {
        if (paused) 
        {
            requestAnimationFrame(update);
            return;
        }

        // Fade old drawings slightly 
        ctx.fillStyle = "rgba(255, 255, 255, 0.08)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw new random rectangle
        if (createRectangles)
        {
            drawRandomRect();
        }

        requestAnimationFrame(update);
    }

    function drawRectangle(ctx,x,y,width,height,fillStyle="black",lineWidth=0,strokeStyle="black"){
        ctx.save();

        ctx.fillStyle = fillStyle;
        ctx.lineWidth = lineWidth;
        ctx.strokeStyle = strokeStyle;

        ctx.beginPath();
        ctx.rect(x, y, width, height);
        ctx.fill();

        if (lineWidth > 0) {
            ctx.stroke();
        }

        ctx.restore();
    }

    // Main execution
    setupUI();
    update();
</script>

</body>
</html>
