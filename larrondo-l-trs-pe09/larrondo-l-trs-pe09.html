<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Canvas Transforms Starter</title>
	<style>
	canvas{
		border:1px solid gray;
	}
	</style>
</head>
<body>
	<canvas width="640" height="480">
		Get a real browser!
	</canvas>
	<script>
		'use strict';
		
        let ctx = document.querySelector('canvas').getContext('2d');
        let rot = 0;
		let anim_pos_x = 0;
		let scale_change = 0.01;

		loop();
	
		function loop(){
            requestAnimationFrame(loop);
            rot += 0.05;
			scale_change += 0.001;
			updateAnimPosX();

			// background
			ctx.fillStyle = 'yellow'; 
			ctx.fillRect(0,0,640,480); 

            drawSquare2(ctx, 200, 100, 100, 100, rot, "purple", 0.75);
            drawSquare2(ctx, 350, 100, 100, 100, -rot, "purple", 1.0);
            drawSquare2(ctx, 500, 300, 100, 100, Math.PI/6.0, "purple", 1.25);

			drawTriangle(ctx, 200, 300, 100, rot, "cyan", "blue", 5, 1.0);

			drawCone(ctx, anim_pos_x, 400, 20, 100, 0, "magenta", "red", 5, 1.0 + scale_change);

            // draw a "better" triangle - why is this better? You'll see!
			ctx.strokeStyle="red";
            ctx.save();
            ctx.translate(500,100);
            ctx.rotate(rot);
 			ctx.fillStyle="red";
 			ctx.lineWidth="5";
 			ctx.beginPath();
			ctx.moveTo(0,-50);
			ctx.lineTo(50,50);
 			ctx.lineTo(-50,50);
 			ctx.closePath();
 			ctx.stroke();
            ctx.restore();
            
			// do some transformations?
            ctx.save();
			ctx.translate(100,0);
			ctx.rotate(rot);
			//ctx.scale(1.2,1.2);
			
			
			// set a bunch of state attributes
			 ctx.shadowOffsetX = 15;
			 ctx.shadowOffsetY = 15;
			 ctx.shadowColor = "rgba(153,50,204,.6)";
			 ctx.shadowBlur = 5;
		
		
			// draw square with fillRect() convenience method
			//ctx.fillStyle="green";
			//ctx.fillRect(100,100,100,100);
		
			// draw square with rect()
			//ctx.fillStyle="blue";
			//ctx.beginPath();
			//ctx.rect(300,100,100,100);
			//ctx.closePath();
			//ctx.fill();
			
			// draw squares with our helper function
			drawSquare1(ctx,100,0,100,100,"orange");
			drawSquare1(ctx,250,0,100,100,"orange");
			drawSquare1(ctx,400,0,100,100,"orange");
		
			// draw a triangle
            ctx.save();
			ctx.strokeStyle="pink";
			ctx.fillStyle="green";
			ctx.lineWidth="5";
			ctx.beginPath();
			ctx.moveTo(500,100);
			ctx.lineTo(550,200);
			ctx.lineTo(450,200);
			ctx.closePath();
            ctx.fill();
			ctx.stroke();
            ctx.restore();
			

            ctx.restore();
		}

		function updateAnimPosX(){
			anim_pos_x += 2;
			if(anim_pos_x > 640) anim_pos_x = 0;
		}


		function drawSquare1(ctx,x,y,width,height,fillStyle){
			ctx.save();
			ctx.fillStyle=fillStyle;
			ctx.fillRect(x,y,width,height);
			ctx.restore();
		}

        function drawSquare2(ctx, x, y, width, height, rot, fill_style, scale)
        {
            ctx.save();
            ctx.fillStyle = fill_style;
            ctx.translate(x,y);
            ctx.rotate(rot);
            ctx.scale(scale, scale);
            ctx.fillRect(0 - width / 2, 0 - height / 2, width, height);
            ctx.restore();
        }

		function drawTriangle(ctx, x, y, size, rot, fill_style, stroke_style, line_width, scale)
		{
    		ctx.save();
    		ctx.translate(x, y);    
    		ctx.rotate(rot);        
    		ctx.scale(scale, scale); 
    
    		ctx.fillStyle = fill_style;
    		ctx.strokeStyle = stroke_style;
    		ctx.lineWidth = line_width;

    		ctx.beginPath();
    		ctx.moveTo(0, -size / 2);       
    		ctx.lineTo(size / 2, size / 2);  
    		ctx.lineTo(-size / 2, size / 2); 
    		ctx.closePath();
    		ctx.fill();
    		ctx.stroke();
    		ctx.restore();
		}

		function drawCone(ctx, x, y, radius, length, rot, fill_style, stroke_style, line_width, scale)
		{
			ctx.save();
			ctx.translate(x, y);    
			ctx.rotate(rot);        
			ctx.scale(scale, scale); 
	
			ctx.fillStyle = fill_style;
			ctx.strokeStyle = stroke_style;
			ctx.lineWidth = line_width;

			ctx.beginPath();
			ctx.moveTo(-length / 2, radius);  

        	ctx.arc(length / 2, radius, 
                radius , 
                	Math.PI * 3/ 2, Math.PI / 2,);

        	ctx.closePath();
			ctx.fill();
			ctx.stroke();
			ctx.restore();
		}

	</script>
</body>
</html>
