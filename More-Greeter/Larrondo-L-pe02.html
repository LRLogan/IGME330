<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PE 2</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&family=Oxanium:wght@200..800&family=Playpen+Sans:wght@100..800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        button {
            width: 150px;
            height: 50px;
            font-size: 14pt;
            margin-right: 10px;
        }

        .oxanium-font {
            font-family: "Oxanium", sans-serif;
            font-optical-sizing: auto;
            font-weight: 300;
            font-style: normal;
        }

        @media screen and (min-width: 1024px) {
            body {
                background-color: red;
            }
        }
    </style>

    <script>
        window.onload = () => {
            const btnHello = document.querySelector('#btn-hello');
            const btnGoodbye = document.querySelector('#btn-goodbye');
            const greetingText = document.querySelector('#greeting');
            const firstNameInput = document.querySelector('#firstnameinput');
            const lastNameInput = document.querySelector('#lastnameinput');
            const shoutifyCheckbox = document.querySelector('#shoutify');

            btnHello.addEventListener('click', () => {
                greet('Hello');
            });

            btnGoodbye.addEventListener('click', () => {
                greet('Goodbye');
            });

            greetingText.style.backgroundColor = 'yellow';
            greetingText.style.color = 'red';

            const greet = (greeting) => {
                let firstName = firstNameInput.value || 'Peter';
                let lastName = lastNameInput.value || 'Parker';

                let message = `${greeting}, ${firstName} ${lastName}!`;

                if (shoutifyCheckbox.checked) {
                    message = message.toUpperCase();
                }

                greetingText.textContent = message;

                firstNameInput.value = '';
                lastNameInput.value = '';
            }
        };
    </script>
</head>
<body class="oxanium-font">

    <button id="btn-hello">Say Hello</button>
    <button id="btn-goodbye">Say Goodbye</button>
    <label>
        <input type="checkbox" id="shoutify">
        Shoutify
    </label>
    <br><br>

    <input type="text" placeholder="First name" id="firstnameinput">
    <input type="text" placeholder="Last name" id="lastnameinput">

    <p id="greeting">
        Hi there!
    </p>

</body>
</html>
