<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screensaver</title>

    <link rel="stylesheet" href="styles/default-styles.css">
</head>
<body>

<section>
    <button id="btn_play">Play</button>
    <button id="btn_pause">Pause</button>
    <button id="btn_clear">Clear</button>
</section>

<section>
    <span>
        <input type="checkbox" id="cb_rectangles" checked>
        <label for="cb_rectangles">Rectangles</label>

        <input type="checkbox" id="cb_arcs">
        <label for="cb_arcs">Arcs</label>

        <input type="checkbox" id="cb_lines">
        <label for="cb_lines">Lines</label>
    </span>
</section>

<section>
    <p>Click on the screen to "spraypaint" rectangles (you probably want the screensaver to be paused)</p>
</section>

<canvas id="canvas" width="800" height="600"></canvas>

<script type="module" src="src/main.js"></script>

</body>
</html>
